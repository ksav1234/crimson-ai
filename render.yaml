services:
  # Web Service - Node.js Express Backend
  - type: web
    name: ai-chatbot-baseline
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE
        value: 86400000
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-chatbot-db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: ai-chatbot-db
    databaseName: crimson_ai
    user: crimson_ai_user
    plan: free
